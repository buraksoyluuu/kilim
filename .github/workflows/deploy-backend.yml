# Backend'i Cloudflare'e kurar/günceller: D1 veritabanı (yoksa oluşturur), şema, Worker deploy.
# Gerekli secret: CLOUDFLARE_API_TOKEN (Workers Scripts Edit + D1 Edit). Elle tetiklenir.
name: Deploy backend
on:
  workflow_dispatch:
env:
  CLOUDFLARE_ACCOUNT_ID: b27e75d57b7f7ca1ade2984c4a43fc06
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  WRANGLER_SEND_METRICS: "false"
  WORKERS_SUBDOMAIN: kilimgame
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci && npm run typecheck && npm test
      - name: workers.dev alt alan adı (ilk kurulumda)
        run: |
          curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
            -d "{\"subdomain\":\"$WORKERS_SUBDOMAIN\"}" | head -c 400; echo
      - name: D1 veritabanı (yoksa oluştur)
        run: |
          ID=$(npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s).find(d=>d.name==="kilim");console.log(x?x.uuid:"")})')
          if [ -z "$ID" ]; then
            npx wrangler d1 create kilim --location weur
            ID=$(npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{console.log(JSON.parse(s).find(d=>d.name==="kilim").uuid)})')
          fi
          echo "D1 id: $ID"
          sed -i "s/REPLACE_WITH_D1_ID/$ID/" wrangler.toml
      - run: npx wrangler d1 execute kilim --remote --file=schema.sql
      - run: npx wrangler deploy
      - name: Duman testi
        run: |
          sleep 10
          echo "time (kimliksiz → 401 beklenir):"
          curl -s -w " %{http_code}\n" "https://kilim-api.$WORKERS_SUBDOMAIN.workers.dev/time"
