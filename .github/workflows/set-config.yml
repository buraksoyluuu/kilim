# Uzaktan ayar: koda/sürüme dokunmadan oyun parametresi değiştirir (ör. lives_refill_hours = 5).
# GitHub › Actions › "Set config" › Run workflow. Uygulama açılışta /config'i okur.
name: Set config
on:
  workflow_dispatch:
    inputs:
      key:
        description: 'Ayar'
        type: choice
        options: [lives_refill_hours, lives_max, lives_refill_coins, iap_test_store, ads_test_mode, notif_enabled, notif_max_per_day, notif_daily_hour, notif_streak_hour, inter_from_level, rewarded_daily_cap]
        default: lives_refill_hours
      value:
        description: 'Değer (sayı)'
        required: true
        default: '3'
env:
  CLOUDFLARE_ACCOUNT_ID: b27e75d57b7f7ca1ade2984c4a43fc06
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  WRANGLER_SEND_METRICS: "false"
jobs:
  set:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
      - name: Yaz
        env: { KEY: '${{ inputs.key }}', VAL: '${{ inputs.value }}' }
        run: |
          [[ "$VAL" =~ ^[0-9]+(\.[0-9]+)?$ ]] || { echo "Değer sayı olmalı"; exit 1; }
          ID=$(npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{console.log(JSON.parse(s).find(d=>d.name==="kilim").uuid)})')
          sed -i "s/REPLACE_WITH_D1_ID/$ID/" wrangler.toml
          npx wrangler d1 execute kilim --remote --command "INSERT INTO docs(path,parent,data) VALUES('config/live','config',json_object('$KEY',$VAL)) ON CONFLICT(path) DO UPDATE SET data=json_set(data,'\$.$KEY',$VAL)"
          npx wrangler d1 execute kilim --remote --command "SELECT data FROM docs WHERE path='config/live'"
