name: core-tests
on:
  push:
  pull_request:
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Core (netstandard2.1, Unity ile aynı hedef)
        run: dotnet build Core/Kilim.Core.csproj -c Release
      - name: Birim testleri
        run: dotnet run --project Core.Tests -c Release
      - name: Unity katmanı tip kontrolü (stub UnityEngine)
        run: dotnet build Tools/UnityTypecheck/Kilim.UnityTypecheck.csproj -c Release
      - name: Oyundaki bölüm dosyaları kaynakla aynı
        run: for f in Data/levels/region*.json; do cmp "$f" "Unity/Kilim/Assets/Kilim/Resources/levels/$(basename $f)"; done
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bölüm verisi çözücüyle doğrulanır
        run: python Tools/validate_levels.py Data/levels/region*.json
      - name: Çeviri tablosu (çift anahtar açılışı çökertir)
        run: python Tools/check_loc.py
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: cd Backend/worker && npm ci && npm run typecheck && npm test
