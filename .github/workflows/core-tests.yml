name: core-tests
on:
  push:
  pull_request:
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Core (netstandard2.1, Unity ile aynı hedef)
        run: dotnet build Core/Kilim.Core.csproj -c Release
      - name: Birim testleri
        run: dotnet run --project Core.Tests -c Release
      - name: Unity katmanı tip kontrolü (stub UnityEngine)
        run: dotnet build Tools/UnityTypecheck/Kilim.UnityTypecheck.csproj -c Release
      - name: Oyundaki bölüm dosyası kaynakla aynı
        run: cmp Data/levels/region1.json Unity/Kilim/Assets/Kilim/Resources/levels/region1.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bölüm verisi çözücüyle doğrulanır
        run: python Tools/validate_levels.py Data/levels/region1.json
