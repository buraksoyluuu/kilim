# Test build'leri. Elle tetiklenir: Actions › Beta build › Run workflow.
#  - Android: APK (telefona doğrudan kurulum) artifact olarak indirilir; Play anahtarı varsa AAB internal teste de gider.
#  - iOS: Unity Xcode projesi → macOS'ta otomatik imzalama (App Store Connect API anahtarı) → TestFlight.
# Secret'lar: UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD; iOS için APPSTORE_KEY_ID, APPSTORE_ISSUER_ID, APPSTORE_P8.
name: Beta build
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "android, ios ya da both"
        default: both
env:
  KILIM_BUILD: ${{ github.run_number }}
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: dotnet run --project Core.Tests -c Release
      - run: dotnet build Tools/UnityTypecheck/Kilim.UnityTypecheck.csproj -c Release

  android:
    needs: tests
    if: inputs.platforms != 'ios'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with: { path: Unity/Kilim/Library, key: Library-Android-${{ hashFiles('Unity/Kilim/Packages/manifest.json') }} }
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: Unity/Kilim
          unityVersion: 6000.0.30f1
          targetPlatform: Android
          buildMethod: Kilim.EditorTools.BuildScript.BuildFromCommandLine
          customParameters: -customBuildPath build/Android/Kilim.apk
      - uses: actions/upload-artifact@v4
        with: { name: kilim-android-apk, path: Unity/Kilim/build/Android/*.apk, retention-days: 14 }

  ios:
    needs: tests
    if: inputs.platforms != 'android'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with: { path: Unity/Kilim/Library, key: Library-iOS-${{ hashFiles('Unity/Kilim/Packages/manifest.json') }} }
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: Unity/Kilim
          unityVersion: 6000.0.30f1
          targetPlatform: iOS
          buildMethod: Kilim.EditorTools.BuildScript.BuildFromCommandLine
          customParameters: -customBuildPath build/iOS/Kilim
      - uses: actions/upload-artifact@v4
        with: { name: ios-xcode, path: Unity/Kilim/build/iOS, retention-days: 3 }

  testflight:
    needs: ios
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: ios-xcode, path: build/iOS }
      - run: gem install fastlane --no-document
      - run: fastlane ios beta
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_P8: ${{ secrets.APPSTORE_P8 }}
          APPLE_TEAM_ID: 3UTU4G8NGA
