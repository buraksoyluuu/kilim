# Test build'leri. Elle tetiklenir: Actions › Beta build › Run workflow.
#  - Android: APK (telefona doğrudan kurulum) artifact olarak indirilir; Play anahtarı varsa AAB internal teste de gider.
#  - iOS: Unity Xcode projesi → macOS'ta otomatik imzalama (App Store Connect API anahtarı) → TestFlight.
# Secret'lar: UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD; iOS: APPSTORE_P8, APPLE_DIST_CERT;
# Android: ANDROID_SIGNING (kalıcı yükleme anahtarı), GOOGLE_PLAY_JSON (varsa AAB Play internal teste gider).
# ANDROID_SIGNING ve APPLE_DIST_CERT "Setup signing (bir kez)" iş akışıyla üretilir.
name: Beta build
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "android, ios ya da both"
        default: both
      ios_run_id:
        description: "Dolu ise iOS Unity build'i atlanır, bu çalıştırmanın Xcode projesi TestFlight'a yüklenir"
        default: ""
      cert_run_id:
        description: "APPLE_DIST_CERT secret'ı yoksa sertifikayı bu çalıştırmanın dist-cert artifact'ından al"
        default: ""
env:
  KILIM_BUILD: ${{ github.run_number }}
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: dotnet run --project Core.Tests -c Release
      - run: dotnet build Tools/UnityTypecheck/Kilim.UnityTypecheck.csproj -c Release

  meta:
    runs-on: ubuntu-latest
    outputs:
      play: ${{ steps.m.outputs.play }}
    steps:
      - id: m
        env: { PLAY: "${{ secrets.GOOGLE_PLAY_JSON }}", SIGN: "${{ secrets.ANDROID_SIGNING }}" }
        run: echo "play=$([ -n "$PLAY" ] && [ -n "$SIGN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  android:
    needs: [tests, meta]
    if: inputs.platforms != 'ios'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kind: [apk, aab]
    steps:
      - name: Bu tür gerekli mi?
        id: want
        run: echo "go=true" >> "$GITHUB_OUTPUT"   # AAB her zaman: Play'e elle/otomatik yükleme için
      - if: steps.want.outputs.go == 'true'
        uses: jlumbroso/free-disk-space@v1.3.1
        with: { tool-cache: false, android: true, large-packages: false }
      - if: steps.want.outputs.go == 'true'
        uses: actions/checkout@v4
      - name: Yükleme anahtarı (ANDROID_SIGNING)
        if: steps.want.outputs.go == 'true'
        id: sign
        env: { SIGN: "${{ secrets.ANDROID_SIGNING }}" }
        run: |
          if [ -z "$SIGN" ]; then echo "ANDROID_SIGNING yok: APK hata ayıklama anahtarıyla imzalanır (güncellemede önce kaldırmak gerekir)"; exit 0; fi
          python3 - <<'PY'
          import base64, json, os
          d = json.loads(base64.b64decode(os.environ["SIGN"]))
          with open(os.environ["GITHUB_OUTPUT"], "a") as o:
              for k in ("keystore", "storepass", "alias", "keypass"):
                  if k != "alias": print(f"::add-mask::{d[k]}")
                  o.write(f"{k}={d[k]}\n")
          PY
      - if: steps.want.outputs.go == 'true'
        uses: actions/cache@v4
        with:
          path: Unity/Kilim/Library
          key: Library-Android-${{ hashFiles('Unity/Kilim/Packages/manifest.json') }}
      - name: AdMob kimlikleri (secret yoksa test kimlikleri)
        env: { ADS: "${{ secrets.ADMOB_JSON }}" }
        run: '[ -n "$ADS" ] && printf "%s" "$ADS" > Unity/Kilim/Assets/Kilim/Resources/ads.json || true'
      - if: steps.want.outputs.go == 'true'
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: Unity/Kilim
          unityVersion: 6000.0.30f1
          targetPlatform: Android
          buildMethod: Kilim.EditorTools.BuildScript.BuildFromCommandLine
          buildName: Kilim
          androidExportType: ${{ matrix.kind == 'aab' && 'androidAppBundle' || 'androidPackage' }}
          androidVersionCode: ${{ github.run_number }}
          androidKeystoreName: kilim-upload.keystore
          androidKeystoreBase64: ${{ steps.sign.outputs.keystore }}
          androidKeystorePass: ${{ steps.sign.outputs.storepass }}
          androidKeyaliasName: ${{ steps.sign.outputs.alias }}
          androidKeyaliasPass: ${{ steps.sign.outputs.keypass }}
      - if: steps.want.outputs.go == 'true' && matrix.kind == 'apk'
        uses: actions/upload-artifact@v4
        with: { name: kilim-android-apk, path: build/Android/*.apk, retention-days: 30 }
      - if: matrix.kind == 'aab'
        uses: actions/upload-artifact@v4
        with: { name: kilim-android-aab, path: build/Android/*.aab, retention-days: 30 }
      - name: Google Play internal test
        if: matrix.kind == 'aab' && needs.meta.outputs.play == 'true'
        env: { GOOGLE_PLAY_JSON: "${{ secrets.GOOGLE_PLAY_JSON }}" }
        run: |
          gem install fastlane --no-document
          fastlane android internal

  ios:
    needs: tests
    if: inputs.platforms != 'android' && inputs.ios_run_id == ''
    runs-on: ubuntu-latest
    steps:
      - uses: jlumbroso/free-disk-space@v1.3.1
        with: { tool-cache: false, android: true, large-packages: false }
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: Unity/Kilim/Library
          key: Library-iOS-${{ hashFiles('Unity/Kilim/Packages/manifest.json') }}
      - name: AdMob kimlikleri (secret yoksa test kimlikleri)
        env: { ADS: "${{ secrets.ADMOB_JSON }}" }
        run: '[ -n "$ADS" ] && printf "%s" "$ADS" > Unity/Kilim/Assets/Kilim/Resources/ads.json || true'
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: Unity/Kilim
          unityVersion: 6000.0.30f1
          targetPlatform: iOS
          buildMethod: Kilim.EditorTools.BuildScript.BuildFromCommandLine
          buildName: Kilim
      - uses: actions/upload-artifact@v4
        with: { name: ios-xcode, path: build/iOS, retention-days: 3 }

  testflight:
    needs: ios
    if: always() && inputs.platforms != 'android' && (needs.ios.result == 'success' || inputs.ios_run_id != '')
    runs-on: macos-latest
    permissions: { contents: read, actions: read }
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ios-xcode
          path: build/iOS
          run-id: ${{ inputs.ios_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - if: inputs.cert_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: dist-cert
          path: dist-cert-in
          run-id: ${{ inputs.cert_run_id }}
          github-token: ${{ github.token }}
      - run: gem install fastlane --no-document
      - run: fastlane ios beta
        env:
          APPSTORE_KEY_ID: U4H4GYWYG8                               # "Kilim CI" anahtarı (gizli değil)
          APPSTORE_ISSUER_ID: 3da5eccb-1939-4eb8-9db6-8ebf7aee4c9a   # ekip kimliği (gizli değil)
          APPSTORE_P8: ${{ secrets.APPSTORE_P8 }}
          APPLE_DIST_CERT: ${{ secrets.APPLE_DIST_CERT }}
          APPLE_TEAM_ID: 3UTU4G8NGA
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: dist-cert, path: dist-cert, retention-days: 7, if-no-files-found: ignore }
