# Beta build: Android AAB → Play internal testing, iOS → TestFlight. Elle tetiklenir (Actions › Beta build › Run).
# Gerekli secret'lar: docs/yayin-kontrol-listesi.md › G. Ön koşul: Unity/Kilim/ProjectSettings commit edilmiş olmalı.
name: Beta build
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "android, ios ya da both"
        default: both
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: dotnet run --project Core.Tests -c Release
      - run: dotnet build Tools/UnityTypecheck/Kilim.UnityTypecheck.csproj -c Release

  android:
    needs: tests
    if: inputs.platforms != 'ios'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }
      - uses: actions/cache@v4
        with: { path: Unity/Kilim/Library, key: Library-Android-${{ hashFiles('Unity/Kilim/Packages/manifest.json') }} }
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: Unity/Kilim
          targetPlatform: Android
          androidExportType: androidAppBundle
          androidKeystoreName: kilim.keystore
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}
          versioning: Semantic
      - uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ vars.ANDROID_PACKAGE }}
          releaseFiles: build/Android/*.aab
          track: internal
          status: completed

  ios:
    needs: tests
    if: inputs.platforms != 'android'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }
      - uses: actions/cache@v4
        with: { path: Unity/Kilim/Library, key: Library-iOS-${{ hashFiles('Unity/Kilim/Packages/manifest.json') }} }
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with: { projectPath: Unity/Kilim, targetPlatform: iOS, versioning: Semantic }
      - uses: actions/upload-artifact@v4
        with: { name: ios-xcode, path: build/iOS }

  testflight:
    needs: ios
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: ios-xcode, path: build/iOS }
      - run: bundle install || gem install fastlane
      - run: fastlane ios beta
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_P8: ${{ secrets.APPSTORE_P8 }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ vars.MATCH_GIT_URL }}
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
